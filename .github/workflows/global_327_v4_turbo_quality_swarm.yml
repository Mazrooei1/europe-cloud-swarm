name: Engine v4.0 Turbo Quality Swarm (143 Portals, 48w Sliding-Window -> portals_v4)

on:
  schedule:
    # Staggered 6h waves (01:30, 07:30, 13:30, 19:30 UTC) with strict run-number round-robin rotation
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      wave:
        description: 'Batch from v4_global_portals.json (v4_batch_1..v4_batch_8, or auto)'
        required: true
        default: 'v4_batch_1'
        type: choice
        options:
          - v4_batch_1
          - v4_batch_2
          - v4_batch_3
          - v4_batch_4
          - v4_batch_5
          - v4_batch_6
          - v4_batch_7
          - v4_batch_8
          - auto
      max_minutes:
        description: 'Soft time budget per runner in minutes (default 290 = 4h50m)'
        required: false
        default: '290'
      shard_size:
        description: 'Records per verified uncompressed .sqlite/.csv/.jsonl shard (default 50000)'
        required: false
        default: '50000'

jobs:
  select_v4_matrix:
    name: Build 20-Runner Engine v4.0 Turbo Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Cloud Swarm Repository
        uses: actions/checkout@v4

      - name: Load Batch with Strict Run-Number Round-Robin Rotation
        id: set-matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path("v4_global_portals.json").read_text(encoding="utf-8"))
          batches = data["batches"]
          wave = "${{ github.event.inputs.wave || 'auto' }}".strip()
          if not wave or wave == "auto":
              run_num = int("${{ github.run_number }}")
              slot = ((run_num - 1) % len(batches)) + 1
              wave = f"v4_batch_{slot}"
          selected = batches.get(wave, batches["v4_batch_1"])
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  extract_v4_shards:
    name: v4.0 Turbo ${{ matrix.domain }} (${{ matrix.cc }})
    needs: select_v4_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.select_v4_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Cloud Swarm Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & rclone
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Configure rclone Google Drive Remote
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Run Engine v4.0 Turbo High-Accuracy Worker (48w Sliding-Window)
        run: |
          MAX_M="${{ github.event.inputs.max_minutes || '290' }}"
          SHARD_SZ="${{ github.event.inputs.shard_size || '50000' }}"
          python3 universal_cloud_worker_v4.py \
            --domain "${{ matrix.domain }}" \
            --country-code "${{ matrix.cc }}" \
            --capacity "${{ matrix.capacity }}" \
            --workers 48 \
            --shard-size "$SHARD_SZ" \
            --batch-size 10000 \
            --max-minutes "$MAX_M" \
            --rclone-dest "gdrive:Global_Cloud_Swarm_Exports/portals_v4/${{ matrix.domain }}"
