name: Global 327-Portal Resumable Wave Swarm [PAUSED - Manual Only]

on:
  # PAUSED: Dedicated runner slots to verified Engine v3.0 + Engine v4.0 Turbo (>85% accuracy)
  # schedule:
  #   - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      wave:
        description: 'Batch from reachable_158_waves.json (batch_1..batch_8, or auto)'
        required: true
        default: 'batch_1'
        type: choice
        options:
          - batch_1
          - batch_2
          - batch_3
          - batch_4
          - batch_5
          - batch_6
          - batch_7
          - batch_8
          - auto
      max_minutes:
        description: 'Soft time budget per runner in minutes (default 290 = 4h50m)'
        required: false
        default: '290'
      shard_size:
        description: 'Records per uncompressed .sqlite/.csv/.jsonl shard (default 50000)'
        required: false
        default: '50000'

jobs:
  select_wave_matrix:
    name: Build 20-Runner Reachable Wave Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Cloud Swarm Repository
        uses: actions/checkout@v4

      - name: Load Confirmed Reachable Batch from reachable_158_waves.json
        id: set-matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, time
          from pathlib import Path

          data = json.loads(Path("reachable_158_waves.json").read_text(encoding="utf-8"))
          batches = data["batches"]
          wave = "${{ github.event.inputs.wave || 'auto' }}".strip()
          if not wave or wave == "auto":
              # Rotate deterministically across all 8 batches every 6 hours
              slot = int(time.time() // (6 * 3600)) % len(batches) + 1
              wave = f"batch_{slot}"
          selected = batches.get(wave, batches["batch_1"])
          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          PY

  extract_wave_shards:
    name: Extract ${{ matrix.domain }} (${{ matrix.cc }})
    needs: select_wave_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.select_wave_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Cloud Swarm Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & rclone
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Configure rclone Google Drive Remote
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Run 35-Worker Ultra-High-Throughput Engine v2.0
        run: |
          MAX_M="${{ github.event.inputs.max_minutes || '290' }}"
          SHARD_SZ="${{ github.event.inputs.shard_size || '50000' }}"
          python3 universal_cloud_worker.py \
            --domain "${{ matrix.domain }}" \
            --country-code "${{ matrix.cc }}" \
            --workers 35 \
            --shard-size "$SHARD_SZ" \
            --batch-size 10000 \
            --max-minutes "$MAX_M" \
            --rclone-dest "gdrive:Global_Cloud_Swarm_Exports/portals/${{ matrix.domain }}"
