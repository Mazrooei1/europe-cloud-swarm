name: Global 327-Portal Resumable Wave Swarm (5h Checkpointed Shards -> Google Drive)

on:
  schedule:
    # Staggered 6-hour continuous checkpointed waves (00:30, 06:30, 12:30, 18:30 UTC)
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      wave:
        description: 'Wave batch to run (wave1_top20, wave1_next20, wave1_final10, or custom)'
        required: true
        default: 'wave1_top20'
        type: choice
        options:
          - wave1_top20
          - wave1_next20
          - wave1_final10
      max_minutes:
        description: 'Soft time budget per runner in minutes (default 290 = 4h50m)'
        required: false
        default: '290'
      shard_size:
        description: 'Records per uncompressed .sqlite/.csv/.jsonl shard (default 100000)'
        required: false
        default: '100000'

jobs:
  select_wave_matrix:
    name: Build 20-Runner Wave Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select Top 50 Mega-Portal Wave Batch
        id: set-matrix
        run: |
          WAVE="${{ github.event.inputs.wave || '' }}"
          if [ -z "$WAVE" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 8 ]; then
              WAVE="wave1_top20"
            elif [ "$HOUR" -lt 16 ]; then
              WAVE="wave1_next20"
            else
              WAVE="wave1_final10"
            fi
          fi
          echo "Selected wave: $WAVE"

          if [ "$WAVE" = "wave1_top20" ]; then
            MATRIX='{"include":[{"domain":"avito.ru","cc":"RU"},{"domain":"58.com","cc":"CN"},{"domain":"leboncoin.fr","cc":"FR"},{"domain":"ke.com","cc":"CN"},{"domain":"olx.com.br","cc":"BR"},{"domain":"kleinanzeigen.de","cc":"DE"},{"domain":"craigslist.org","cc":"US"},{"domain":"olx.in","cc":"IN"},{"domain":"anjuke.com","cc":"CN"},{"domain":"sahibinden.com","cc":"TR"},{"domain":"zillow.com","cc":"US"},{"domain":"suumo.jp","cc":"JP"},{"domain":"marktplaats.nl","cc":"NL"},{"domain":"realtor.com","cc":"US"},{"domain":"milanuncios.com","cc":"ES"},{"domain":"divar.ir","cc":"IR"},{"domain":"olx.pl","cc":"PL"},{"domain":"haraj.com.sa","cc":"SA"},{"domain":"cian.ru","cc":"RU"},{"domain":"homes.co.jp","cc":"JP"}]}'
          elif [ "$WAVE" = "wave1_next20" ]; then
            MATRIX='{"include":[{"domain":"zapimoveis.com.br","cc":"BR"},{"domain":"subito.it","cc":"IT"},{"domain":"athome.co.jp","cc":"JP"},{"domain":"magicbricks.com","cc":"IN"},{"domain":"gumtree.com","cc":"GB"},{"domain":"vivareal.com.br","cc":"BR"},{"domain":"idealista.com","cc":"ES"},{"domain":"domclick.ru","cc":"RU"},{"domain":"99acres.com","cc":"IN"},{"domain":"dubizzle.com","cc":"AE"},{"domain":"immobiliare.it","cc":"IT"},{"domain":"kijiji.ca","cc":"CA"},{"domain":"rightmove.co.uk","cc":"GB"},{"domain":"seloger.com","cc":"FR"},{"domain":"idealista.it","cc":"IT"},{"domain":"immobilienscout24.de","cc":"DE"},{"domain":"bienici.com","cc":"FR"},{"domain":"fotocasa.es","cc":"ES"},{"domain":"zoopla.co.uk","cc":"GB"},{"domain":"olx.pt","cc":"PT"}]}'
          else
            MATRIX='{"include":[{"domain":"batdongsan.com.vn","cc":"VN"},{"domain":"rumah123.com","cc":"ID"},{"domain":"opensooq.com","cc":"OM"},{"domain":"immowelt.de","cc":"DE"},{"domain":"zonaprop.com.ar","cc":"AR"},{"domain":"zameen.com","cc":"PK"},{"domain":"vivanuncios.com.mx","cc":"MX"},{"domain":"property24.com","cc":"ZA"},{"domain":"realestate.com.au","cc":"AU"},{"domain":"willhaben.at","cc":"AT"}]}'
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  extract_wave_shards:
    name: Extract ${{ matrix.domain }} (${{ matrix.cc }})
    needs: select_wave_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.select_wave_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Cloud Swarm Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & rclone
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Configure rclone Google Drive Remote
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Run 32-Worker Resumable Checkpointed Extractor
        run: |
          MAX_M="${{ github.event.inputs.max_minutes || '290' }}"
          SHARD_SZ="${{ github.event.inputs.shard_size || '100000' }}"
          python3 universal_cloud_worker.py \
            --domain "${{ matrix.domain }}" \
            --country-code "${{ matrix.cc }}" \
            --workers 32 \
            --shard-size "$SHARD_SZ" \
            --max-minutes "$MAX_M" \
            --rclone-dest "gdrive:Global_Cloud_Swarm_Exports/portals/${{ matrix.domain }}"
